# Egress proxy cho profile `restricted`.
# Mặc định CHẶN; chỉ domain trong filter được đi qua.

Port 8888
Listen 0.0.0.0
Timeout 600

# Chỉ chấp nhận kết nối từ network nội bộ của compose
Allow 172.16.0.0/12
Allow 192.168.0.0/16
Allow 10.0.0.0/8

Filter "/etc/tinyproxy/filter"
FilterURLs Off
FilterExtended On
FilterCaseSensitive Off
FilterDefaultDeny Yes

# CONNECT chỉ cho cổng HTTPS chuẩn — chặn tunnel ra cổng lạ
ConnectPort 443

LogLevel Notice
DisableViaHeader Yes
